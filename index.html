<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioHome Pro - Gestão Domiciliar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dependências do React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types (Necessário para o Recharts em modo UMD) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts (Gráficos) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .recharts-responsive-container { min-height: 300px; }
    </style>
</head>
<body class="bg-[#FBFBFB]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // --- COMPONENTE PRINCIPAL ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            
            // Verificação de segurança para o Recharts
            const RechartsLib = window.Recharts;
            const { 
                LineChart, Line, XAxis, YAxis, CartesianGrid, 
                Tooltip, ResponsiveContainer, Legend 
            } = RechartsLib || {};

            // URL do seu Google Apps Script
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwraRNSqAc8jCGUXrwTaZv3iuyNfm_z4kW0o_xyWywMoA7pKTtOCVKx-wu5CnUI59cD/exec"; 

            const [patients, setPatients] = useState([
                { 
                    id: 1, 
                    name: 'Sr. Wilson Ferreira', 
                    age: 78, 
                    clinicalDiagnosis: 'Pós-AVC Isquêmico',
                    evaluations: [
                        { 
                            date: '01/03/24', 
                            barthel: 45, 
                            sys: '140', 
                            dia: '90', 
                            sts: 8, 
                            weight: '75', 
                            echo: '1.2cm',
                            functionalChecks: ['Redução de Força', 'Déficit de Equilíbrio'],
                            notes: 'Paciente com hemiparesia à direita.'
                        },
                        { 
                            date: '01/04/24', 
                            barthel: 62, 
                            sys: '135', 
                            dia: '85', 
                            sts: 12, 
                            weight: '74', 
                            echo: '1.4cm',
                            functionalChecks: ['Redução de Força'],
                            notes: 'Melhora no controle de tronco.'
                        }
                    ]
                }
            ]);

            const functionalOptions = [
                "Redução de Força Muscular", "Redução de ADM", "Déficit de Equilíbrio",
                "Déficit de Coordenação", "Alteração de Sensibilidade", "Marcha Alterada",
                "Incapacidade de Transferência", "Dor ao Movimento", "Espasticidade", "Encurtamento Muscular"
            ];

            const [newPatient, setNewPatient] = useState({ name: '', age: '', clinicalDiagnosis: '' });
            const [newEval, setNewEval] = useState({
                date: new Date().toLocaleDateString('pt-BR'),
                sys: '', dia: '', weight: '', height: '',
                barthel: { 
                    alimentacao: 0, banho: 0, higiene: 0, vestir: 0, 
                    intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, 
                    mobilidade: 0, escadas: 0 
                },
                sts: '', echo: '', functionalChecks: [], notes: ''
            });

            // Atualiza ícones Lucide sempre que a tela muda
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedPatientId, patients]);

            const selectedPatient = patients.find(p => p.id === selectedPatientId);
            const calculateBarthel = (b) => Object.values(b).reduce((acc, curr) => acc + parseInt(curr), 0);

            const handleSaveEvaluation = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const score = calculateBarthel(newEval.barthel);

                const evaluationData = {
                    ...newEval,
                    barthelScore: score,
                    patientName: selectedPatient.name,
                    clinicalDiagnosis: selectedPatient.clinicalDiagnosis
                };

                try {
                    const updated = patients.map(p => p.id === selectedPatientId ? { ...p, evaluations: [...p.evaluations, { ...newEval, barthel: score }] } : p);
                    setPatients(updated);

                    if (GOOGLE_SCRIPT_URL) {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors', 
                            cache: 'no-cache',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(evaluationData)
                        });
                    }
                    setActiveTab('profile');
                } catch (error) {
                    console.error("Erro ao salvar:", error);
                } finally {
                    setIsSaving(false);
                }
            };

            const Dashboard = () => (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800">Prontuários</h2>
                            <p className="text-xs text-slate-500 font-bold uppercase tracking-widest">Atendimento Domiciliar</p>
                        </div>
                        <button onClick={() => setActiveTab('newPatient')} className="bg-emerald-600 text-white p-4 rounded-2xl shadow-lg flex items-center gap-2">
                            <i data-lucide="plus-circle"></i> <span className="hidden sm:inline font-bold">Novo Paciente</span>
                        </button>
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input 
                            type="text" 
                            placeholder="Buscar paciente..." 
                            className="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-sm bg-white outline-none focus:ring-2 focus:ring-emerald-500"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>

                    <div className="grid gap-3">
                        {patients.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => (
                            <div 
                                key={p.id} 
                                className="bg-white p-5 rounded-3xl shadow-sm border border-slate-50 flex items-center justify-between hover:scale-[1.01] transition-transform cursor-pointer"
                                onClick={() => { setSelectedPatientId(p.id); setActiveTab('profile'); }}
                            >
                                <div className="flex items-center gap-4">
                                    <div className="w-14 h-14 bg-slate-50 text-slate-600 rounded-2xl flex items-center justify-center font-black text-xl border border-slate-100">{p.name[0]}</div>
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-lg">{p.name}</h3>
                                        <p className="text-[10px] text-slate-400 font-black uppercase tracking-tight">{p.clinicalDiagnosis}</p>
                                    </div>
                                </div>
                                <i data-lucide="chevron-right" className="text-slate-300"></i>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const PatientProfile = () => (
                <div className="space-y-6 pb-20">
                    <div className="flex items-center justify-between">
                        <button onClick={() => setActiveTab('dashboard')} className="p-3 bg-white rounded-2xl shadow-sm text-slate-500 hover:text-emerald-600"><i data-lucide="arrow-left"></i></button>
                        <div className="flex gap-2">
                           <button className="p-3 bg-white rounded-2xl shadow-sm text-slate-400"><i data-lucide="share-2"></i></button>
                           <button className="p-3 bg-white rounded-2xl shadow-sm text-slate-400"><i data-lucide="file-text"></i></button>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-50">
                        <div className="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
                            <div className="space-y-2">
                                <span className="text-[10px] font-black uppercase tracking-widest text-emerald-500 bg-emerald-50 px-3 py-1 rounded-full">Registro Profissional</span>
                                <h2 className="text-4xl font-black text-slate-800 leading-none">{selectedPatient?.name}</h2>
                                <p className="text-slate-400 font-bold uppercase text-xs">
                                    {selectedPatient?.clinicalDiagnosis} • {selectedPatient?.age} anos
                                </p>
                            </div>
                            <button 
                                onClick={() => setActiveTab('newEval')}
                                className="w-full md:w-auto bg-slate-900 text-white px-8 py-5 rounded-[1.5rem] flex items-center justify-center gap-3 font-black shadow-2xl hover:bg-emerald-600 transition-all"
                            >
                                <i data-lucide="activity"></i> Reavaliar
                            </button>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-4">
                                <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">Curva de Recuperação</h3>
                                <div className="h-80 w-full bg-slate-50/50 p-6 rounded-[2rem] border border-slate-100">
                                    {selectedPatient?.evaluations.length > 1 && LineChart ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={selectedPatient?.evaluations}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                <XAxis dataKey="date" fontSize={10} tick={{fill: '#94a3b8'}} />
                                                <YAxis fontSize={10} tick={{fill: '#94a3b8'}} />
                                                <Tooltip contentStyle={{ borderRadius: '15px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} />
                                                <Legend iconType="circle" />
                                                <Line type="monotone" dataKey="barthel" name="Barthel" stroke="#10b981" strokeWidth={5} dot={{r: 6, fill: '#10b981'}} />
                                                <Line type="monotone" dataKey="sts" name="STS" stroke="#3b82f6" strokeWidth={5} dot={{r: 6, fill: '#3b82f6'}} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center text-slate-300 gap-2">
                                            <i data-lucide="trending-up" className="w-12 h-12 opacity-20"></i>
                                            <p className="text-sm font-bold">Gráfico disponível após 2 avaliações</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="bg-emerald-600 text-white p-7 rounded-[2rem] shadow-xl flex flex-col justify-center">
                                <p className="text-[10px] font-black opacity-60 uppercase mb-4 tracking-widest">Score Barthel Atual</p>
                                <h4 className="text-6xl font-black">{selectedPatient?.evaluations.length > 0 ? selectedPatient.evaluations.at(-1)?.barthel : '00'}</h4>
                                <div className="mt-6 flex flex-wrap gap-1.5">
                                    {selectedPatient?.evaluations.at(-1)?.functionalChecks.map((c, i) => (
                                        <span key={i} className="text-[9px] bg-white/20 px-2 py-1 rounded font-black uppercase">{c}</span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const EvaluationForm = () => (
                <div className="max-w-4xl mx-auto space-y-6 pb-24">
                    <div className="flex items-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-50">
                        <button onClick={() => setActiveTab('profile')} className="p-2 bg-slate-50 rounded-xl text-slate-500 hover:text-emerald-600"><i data-lucide="arrow-left"></i></button>
                        <h2 className="text-lg font-black text-slate-800">Avaliação Ciclo 4 Semanas</h2>
                    </div>

                    <form onSubmit={handleSaveEvaluation} className="space-y-6">
                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                            <h3 className="font-black text-slate-800 mb-8 border-b pb-4 flex items-center gap-2"><i data-lucide="stethoscope" className="text-emerald-500 w-5 h-5"></i> Sinais Vitais</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {[
                                    { id: 'sys', label: 'Sistólica (PA)' },
                                    { id: 'dia', label: 'Diastólica (PA)' },
                                    { id: 'weight', label: 'Peso (Kg)' },
                                    { id: 'echo', label: 'ECO (cm)' }
                                ].map(f => (
                                    <div key={f.id} className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase">{f.label}</label>
                                        <input className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" value={newEval[f.id]} onChange={e => setNewEval({...newEval, [f.id]: e.target.value})} />
                                    </div>
                                ))}
                            </div>
                            <div className="mt-6">
                                <label className="text-[10px] font-black text-slate-400 uppercase">STS (Senta e Levanta - 30s)</label>
                                <input type="number" className="w-full p-5 bg-slate-50 rounded-2xl outline-none font-black text-2xl text-emerald-600 focus:ring-2 focus:ring-emerald-500" value={newEval.sts} onChange={e => setNewEval({...newEval, sts: e.target.value})} />
                            </div>
                        </div>

                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                            <h3 className="font-black text-slate-800 mb-8 border-b pb-4 flex items-center gap-2"><i data-lucide="clipboard-check" className="text-emerald-500 w-5 h-5"></i> Escala de Barthel</h3>
                            <div className="space-y-3">
                                {[
                                    { id: 'alimentacao', label: 'Alimentação', options: [0, 5, 10] },
                                    { id: 'banho', label: 'Banho', options: [0, 5] },
                                    { id: 'higiene', label: 'Higiene Pessoal', options: [0, 5] },
                                    { id: 'vestir', label: 'Vestir-se', options: [0, 5, 10] },
                                    { id: 'intestino', label: 'Intestino', options: [0, 5, 10] },
                                    { id: 'bexiga', label: 'Bexiga', options: [0, 5, 10] },
                                    { id: 'banheiro', label: 'Uso do Banheiro', options: [0, 5, 10] },
                                    { id: 'transferencia', label: 'Transferências', options: [0, 5, 10, 15] },
                                    { id: 'mobilidade', label: 'Mobilidade', options: [0, 5, 10, 15] },
                                    { id: 'escadas', label: 'Escadas', options: [0, 5, 10] },
                                ].map(item => (
                                    <div key={item.id} className="flex justify-between items-center p-3 bg-slate-50/50 rounded-2xl">
                                        <span className="text-sm font-bold text-slate-600">{item.label}</span>
                                        <div className="flex gap-1.5">
                                            {item.options.map(val => (
                                                <button key={val} type="button" onClick={() => setNewEval({...newEval, barthel: {...newEval.barthel, [item.id]: val}})} className={`w-10 h-10 rounded-xl text-xs font-black transition-all ${newEval.barthel[item.id] === val ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-300 hover:text-slate-500'}`}>{val}</button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                <div className="mt-8 p-8 bg-emerald-600 rounded-[2rem] text-white flex justify-between items-center shadow-xl">
                                    <span className="font-black uppercase text-xs tracking-widest opacity-80">Total Score Barthel</span>
                                    <span className="text-4xl font-black">{calculateBarthel(newEval.barthel)}</span>
                                </div>
                            </div>
                        </div>

                        <button 
                            type="submit" 
                            disabled={isSaving}
                            className={`w-full py-6 rounded-[2rem] font-black text-xl shadow-2xl transition-all flex items-center justify-center gap-3 ${isSaving ? 'bg-slate-400' : 'bg-slate-900 text-white active:scale-95'}`}
                        >
                            {isSaving ? "Sincronizando..." : "Finalizar e Salvar"}
                        </button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen md:pl-72">
                    <aside className="fixed left-0 top-0 h-full w-72 bg-white border-r hidden md:flex flex-col p-10 z-50">
                        <div className="flex items-center gap-3 mb-16">
                            <div className="bg-emerald-600 p-3 rounded-2xl text-white shadow-2xl"><i data-lucide="stethoscope"></i></div>
                            <h1 className="text-2xl font-black text-slate-800 tracking-tighter">Fisio<span className="text-emerald-600">Home</span></h1>
                        </div>
                        <nav className="space-y-6">
                            <button onClick={() => {setActiveTab('dashboard'); setSelectedPatientId(null);}} className={`w-full flex items-center gap-4 px-6 py-5 rounded-3xl font-black text-sm transition-all ${activeTab === 'dashboard' ? 'bg-slate-900 text-white shadow-xl' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <i data-lucide="users"></i> Pacientes
                            </button>
                        </nav>
                    </aside>

                    <main className="p-6 md:p-16 max-w-7xl mx-auto">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'profile' && <PatientProfile />}
                        {activeTab === 'newEval' && <EvaluationForm />}
                        {activeTab === 'newPatient' && (
                           <div className="max-w-xl mx-auto bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                             <h2 className="text-3xl font-black text-slate-800 mb-8">Novo Paciente</h2>
                             <form onSubmit={(e) => { e.preventDefault(); setPatients([...patients, {...newPatient, id: Date.now(), evaluations: []}]); setActiveTab('dashboard'); }} className="space-y-6">
                                <input required placeholder="Nome Completo" className="w-full p-5 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" value={newPatient.name} onChange={e => setNewPatient({...newPatient, name: e.target.value})} />
                                <input required placeholder="Diagnóstico Clínico" className="w-full p-5 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" value={newPatient.clinicalDiagnosis} onChange={e => setNewPatient({...newPatient, clinicalDiagnosis: e.target.value})} />
                                <input type="number" placeholder="Idade" className="w-full p-5 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" value={newPatient.age} onChange={e => setNewPatient({...newPatient, age: e.target.value})} />
                                <button type="submit" className="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black shadow-xl hover:bg-emerald-700 transition-all">Cadastrar Paciente</button>
                                <button type="button" onClick={() => setActiveTab('dashboard')} className="w-full py-5 text-slate-400 font-bold">Cancelar</button>
                             </form>
                           </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
