<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FisioHome Pro | Gestão e Auditoria</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg);
            -webkit-tap-highlight-color: transparent;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* Melhora o toque no mobile */
        input, button, select, textarea {
            touch-action: manipulation;
            font-size: 16px !important;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .barthel-btn-active {
            background-color: #10b981 !important;
            color: white !important;
            box-shadow: 0 8px 15px -3px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
            border-color: #10b981 !important;
        }

        /* Correção de Layout: Sidebar Desktop */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-desktop {
            width: 18rem;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 40;
        }

        .main-content {
            flex: 1;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-content {
                padding-left: 18rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, 
            Tooltip, ResponsiveContainer, Legend, AreaChart, Area, BarChart, Bar, Cell
        } = window.Recharts;

        const Icon = ({ name, size = 20, className = "" }) => (
            <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>
        );

        const App = () => {
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwraRNSqAc8jCGUXrwTaZv3iuyNfm_z4kW0o_xyWywMoA7pKTtOCVKx-wu5CnUI59cD/exec"; 

            const [activeTab, setActiveTab] = useState('management'); 
            const [patientFilter, setPatientFilter] = useState('active'); 
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            const [patients, setPatients] = useState([
                { 
                    id: 1, name: 'Wilson Ferreira', age: 78, clinicalDiagnosis: 'Pós-AVC Isquêmico', status: 'active', createdAt: '2024-01-15',
                    evaluations: [
                        { date: '01/03/24', barthel: 45, sts: 8, sys: '140', dia: '90', weight: '75', echo: '1.2', functionalChecks: ['Redução de Força'], notes: 'Início.' },
                        { date: '01/04/24', barthel: 65, sts: 12, sys: '132', dia: '84', weight: '74', echo: '1.4', functionalChecks: ['Redução de Força'], notes: 'Evolução.' }
                    ]
                },
                { 
                    id: 2, name: 'Maria de Lurdes', age: 82, clinicalDiagnosis: 'Alzheimer', status: 'active', createdAt: '2024-02-10',
                    evaluations: [{ date: '15/02/24', barthel: 20, sts: 2, sys: '120', dia: '80', weight: '60', echo: '0.9', functionalChecks: ['Incapacidade de Transferência'], notes: 'Acamada.' }]
                },
                { 
                    id: 3, name: 'José Américo', age: 70, clinicalDiagnosis: 'Hérnia de Disco', status: 'archived', createdAt: '2023-11-20',
                    evaluations: [{ date: '20/11/23', barthel: 92, sts: 15, sys: '120', dia: '80', weight: '80', echo: '1.5', functionalChecks: [], notes: 'Alta.' }]
                }
            ]);

            const [newPatient, setNewPatient] = useState({ name: '', age: '', clinicalDiagnosis: '' });
            const [newEval, setNewEval] = useState({
                date: new Date().toLocaleDateString('pt-BR'),
                sys: '', dia: '', weight: '', echo: '',
                barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                sts: '', functionalChecks: [], notes: ''
            });

            const functionalOptions = [
                "Redução de Força Muscular", "Redução de ADM", "Déficit de Equilíbrio",
                "Déficit de Coordenação", "Alteração de Sensibilidade", "Marcha Alterada",
                "Incapacidade de Transferência", "Dor ao Movimento", "Espasticidade", "Encurtamento Muscular"
            ];

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const stats = useMemo(() => {
                const active = patients.filter(p => p.status === 'active').length;
                const archived = patients.filter(p => p.status === 'archived').length;
                const totalEvals = patients.reduce((acc, p) => acc + p.evaluations.length, 0);
                const activeWithEval = patients.filter(p => p.status === 'active' && p.evaluations.length > 0);
                const avgBarthel = activeWithEval.length > 0 
                    ? (activeWithEval.reduce((acc, p) => acc + (p.evaluations.at(-1).barthel || 0), 0) / activeWithEval.length).toFixed(0)
                    : 0;
                const monthlyData = [
                    { mes: 'Jan', ativos: 5, evals: 12 },
                    { mes: 'Fev', ativos: 8, evals: 18 },
                    { mes: 'Mar', ativos: active, evals: totalEvals }
                ];
                return { active, archived, totalEvals, avgBarthel, monthlyData };
            }, [patients]);

            const selectedPatient = useMemo(() => patients.find(p => p.id === selectedPatientId), [patients, selectedPatientId]);
            const calculateBarthel = (b) => Object.values(b).reduce((acc, curr) => acc + parseInt(curr), 0);

            const handleSaveEvaluation = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const score = calculateBarthel(newEval.barthel);
                const evaluationData = {
                    ...newEval,
                    barthelScore: score,
                    patientName: selectedPatient.name,
                    clinicalDiagnosis: selectedPatient.clinicalDiagnosis
                };
                const updated = patients.map(p => p.id === selectedPatientId ? { ...p, evaluations: [...p.evaluations, { ...newEval, barthel: score }] } : p);
                try {
                    if (GOOGLE_SCRIPT_URL) {
                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(evaluationData) });
                    }
                    setPatients(updated);
                    setActiveTab('profile');
                    setNewEval({
                        date: new Date().toLocaleDateString('pt-BR'),
                        sys: '', dia: '', weight: '', echo: '',
                        barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                        sts: '', functionalChecks: [], notes: ''
                    });
                } catch (error) {
                    console.error("Erro ao sincronizar:", error);
                    setPatients(updated);
                    setActiveTab('profile');
                } finally {
                    setIsSaving(false);
                }
            };

            const toggleArchivePatient = (id) => {
                setPatients(patients.map(p => p.id === id ? { ...p, status: p.status === 'active' ? 'archived' : 'active' } : p));
                setActiveTab('patients');
            };

            const handleBarthelClick = (key, val) => {
                setNewEval(prev => ({ ...prev, barthel: { ...prev.barthel, [key]: val } }));
            };

            const handleFunctionalToggle = (opt) => {
                setNewEval(prev => {
                    const exists = prev.functionalChecks.includes(opt);
                    return { ...prev, functionalChecks: exists ? prev.functionalChecks.filter(i => i !== opt) : [...prev.functionalChecks, opt] };
                });
            };

            return (
                <div className="app-container">
                    {/* Sidebar Desktop */}
                    <aside className="sidebar-desktop bg-white border-r hidden md:flex flex-col p-10 shadow-sm">
                        <div className="flex items-center gap-4 mb-14">
                            <div className="bg-emerald-600 p-3.5 rounded-2xl text-white shadow-xl shadow-emerald-100"><Icon name="stethoscope" size={28} /></div>
                            <h1 className="text-2xl font-black text-slate-900 tracking-tighter">Fisio<span className="text-emerald-600">Home</span> Pro</h1>
                        </div>
                        <nav className="space-y-3 flex-1">
                            <button onClick={() => setActiveTab('management')} className={`w-full flex items-center gap-4 px-7 py-5 rounded-[1.5rem] font-black text-sm transition-all ${activeTab === 'management' ? 'bg-slate-900 text-white shadow-2xl' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="layout-dashboard" /> GESTÃO
                            </button>
                            <button onClick={() => {setActiveTab('patients'); setSelectedPatientId(null);}} className={`w-full flex items-center gap-4 px-7 py-5 rounded-[1.5rem] font-black text-sm transition-all ${activeTab === 'patients' ? 'bg-slate-900 text-white shadow-2xl' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="users" /> PACIENTES
                            </button>
                            <button className="w-full flex items-center gap-4 px-7 py-5 rounded-[1.5rem] text-slate-300 font-black text-sm cursor-not-allowed opacity-40">
                                <Icon name="calendar" /> AGENDA
                            </button>
                        </nav>
                        <div className="mt-auto p-6 bg-slate-50 rounded-[2rem] border border-slate-100">
                             <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-black">FP</div>
                                <div className="leading-tight">
                                    <p className="text-xs font-black text-slate-800">Dr. Wagner da Silva Naue</p>
                                    <p className="text-[10px] text-slate-400 uppercase font-bold">Fisioterapeuta</p>
                                </div>
                             </div>
                             <div className="flex items-center gap-2">
                                <span className={`w-2 h-2 rounded-full ${GOOGLE_SCRIPT_URL ? 'bg-emerald-500 animate-pulse' : 'bg-red-400'}`}></span>
                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-500">Google Sheets Sync</span>
                             </div>
                        </div>
                    </aside>

                    {/* Mobile Footer Navigation */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] bg-slate-900/95 backdrop-blur-2xl rounded-[3rem] p-5 flex justify-around md:hidden z-50 shadow-2xl">
                        <button onClick={() => setActiveTab('management')} className={`p-2 transition ${activeTab === 'management' ? 'text-emerald-400' : 'text-slate-500'}`}><Icon name="layout-dashboard" size={28}/></button>
                        <button onClick={() => setActiveTab('patients')} className={`p-2 transition ${activeTab === 'patients' ? 'text-emerald-400' : 'text-slate-500'}`}><Icon name="users" size={28}/></button>
                        <button onClick={() => setActiveTab('newPatient')} className="p-3.5 bg-emerald-500 text-white rounded-full -translate-y-12 shadow-2xl border-4 border-[#f8fafc]"><Icon name="plus" size={32}/></button>
                        <button className="p-2 text-slate-500 opacity-30"><Icon name="calendar" size={28}/></button>
                    </nav>

                    {/* Conteúdo Principal */}
                    <main className="main-content">
                        <div className="p-6 md:p-16 max-w-7xl mx-auto">
                            {activeTab === 'management' && (
                                <div className="space-y-8 fade-in">
                                    <header>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight text-center md:text-left">Gestão Clínica</h2>
                                        <p className="text-slate-500 font-medium text-center md:text-left italic">Indicadores de produtividade e evolução</p>
                                    </header>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col justify-between h-40">
                                            <Icon name="home" className="text-blue-500" />
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Em Atendimento</p>
                                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.active}</h4>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col justify-between h-40">
                                            <Icon name="trending-up" className="text-emerald-500" />
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Média Barthel</p>
                                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.avgBarthel}</h4>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col justify-between h-40">
                                            <Icon name="archive" className="text-slate-400" />
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Arquivados</p>
                                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.archived}</h4>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col justify-between h-40">
                                            <Icon name="clipboard-check" className="text-purple-500" />
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Avaliações</p>
                                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.totalEvals}</h4>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-8 flex items-center gap-2">
                                                <Icon name="bar-chart-2" size={16} className="text-emerald-500" /> Fluxo de Atendimentos
                                            </h3>
                                            <div className="h-64 w-full">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <AreaChart data={stats.monthlyData}>
                                                        <defs>
                                                            <linearGradient id="colorActive" x1="0" y1="0" x2="0" y2="1">
                                                                <stop offset="5%" stopColor="#10b981" stopOpacity={0.2}/>
                                                                <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                                                            </linearGradient>
                                                        </defs>
                                                        <XAxis dataKey="mes" axisLine={false} tickLine={false} />
                                                        <Tooltip />
                                                        <Area type="monotone" dataKey="ativos" stroke="#10b981" strokeWidth={4} fillOpacity={1} fill="url(#colorActive)" />
                                                    </AreaChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>
                                        <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-8">Estatística de Diagnóstico</h3>
                                            <div className="space-y-4">
                                                {Array.from(new Set(patients.map(p => p.clinicalDiagnosis))).map((diag, i) => {
                                                    const count = patients.filter(p => p.clinicalDiagnosis === diag).length;
                                                    const percentage = ((count / patients.length) * 100).toFixed(0);
                                                    return (
                                                        <div key={i} className="flex items-center justify-between">
                                                            <span className="text-sm font-bold text-slate-700">{diag}</span>
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-24 h-1.5 bg-slate-100 rounded-full hidden sm:block">
                                                                    <div className="bg-emerald-500 h-full" style={{width: `${percentage}%`}}></div>
                                                                </div>
                                                                <span className="text-xs font-black text-slate-400">{percentage}%</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'patients' && (
                                <div className="space-y-6 fade-in">
                                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                        <div>
                                            <h2 className="text-3xl font-black text-slate-900 tracking-tight">Prontuários</h2>
                                            <div className="flex gap-4 mt-2">
                                                <button onClick={() => setPatientFilter('active')} className={`text-[10px] font-black uppercase tracking-widest pb-1 border-b-2 transition-all ${patientFilter === 'active' ? 'border-emerald-500 text-emerald-600' : 'border-transparent text-slate-300'}`}>Ativos ({stats.active})</button>
                                                <button onClick={() => setPatientFilter('archived')} className={`text-[10px] font-black uppercase tracking-widest pb-1 border-b-2 transition-all ${patientFilter === 'archived' ? 'border-emerald-500 text-emerald-600' : 'border-transparent text-slate-300'}`}>Arquivo ({stats.archived})</button>
                                            </div>
                                        </div>
                                        <button onClick={() => setActiveTab('newPatient')} className="bg-emerald-600 text-white px-8 py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-all font-black text-xs uppercase">
                                            <Icon name="user-plus" size={16}/> NOVO PACIENTE
                                        </button>
                                    </header>

                                    <div className="relative">
                                        <Icon name="search" size={20} className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300" />
                                        <input 
                                            type="text" placeholder="Procurar paciente..." 
                                            className="w-full pl-14 pr-6 py-5 rounded-[2rem] border-none shadow-sm bg-white outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-medium text-slate-700"
                                            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>

                                    <div className="grid gap-4">
                                        {patients.filter(p => p.status === patientFilter && p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => (
                                            <div key={p.id} className="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-50 flex items-center justify-between hover:shadow-md transition-all cursor-pointer group" onClick={() => { setSelectedPatientId(p.id); setActiveTab('profile'); }}>
                                                <div className="flex items-center gap-5">
                                                    <div className={`w-16 h-16 rounded-[1.5rem] flex items-center justify-center font-black text-2xl ${p.status === 'active' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>{p.name[0]}</div>
                                                    <div>
                                                        <h3 className="font-bold text-slate-800 text-lg leading-tight">{p.name}</h3>
                                                        <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">{p.clinicalDiagnosis}</p>
                                                    </div>
                                                </div>
                                                <Icon name="chevron-right" className="text-slate-200 group-hover:text-emerald-500" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'profile' && selectedPatient && (
                                <div className="space-y-6 fade-in">
                                    <div className="flex items-center justify-between">
                                        <button onClick={() => setActiveTab('patients')} className="p-4 bg-white rounded-2xl shadow-sm text-slate-500 hover:text-emerald-600 transition-all"><Icon name="arrow-left" size={24} /></button>
                                        <button onClick={() => toggleArchivePatient(selectedPatient.id)} className={`px-6 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all ${selectedPatient.status === 'active' ? 'bg-slate-100 text-slate-400 hover:bg-red-50 hover:text-red-500' : 'bg-emerald-100 text-emerald-600'}`}>
                                            {selectedPatient.status === 'active' ? 'Dar Alta / Arquivar' : 'Reativar Atendimento'}
                                        </button>
                                    </div>
                                    
                                    <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                        <div className="flex flex-col md:flex-row justify-between items-start gap-8 mb-12">
                                            <div className="space-y-3">
                                                <h2 className="text-4xl font-black text-slate-900 tracking-tight leading-none">{selectedPatient.name}</h2>
                                                <p className="text-slate-400 font-bold uppercase text-xs">{selectedPatient.clinicalDiagnosis} • {selectedPatient.age} ANOS</p>
                                            </div>
                                            {selectedPatient.status === 'active' && (
                                                <button onClick={() => setActiveTab('newEval')} className="w-full md:w-auto bg-slate-900 text-white px-10 py-6 rounded-[1.8rem] flex items-center justify-center gap-3 font-black shadow-2xl transition-all active:scale-95">
                                                    <Icon name="activity" size={22} /> REAVALIAR AGORA
                                                </button>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                            <div className="lg:col-span-2 space-y-5">
                                                <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icon name="trending-up" size={16} className="text-emerald-500" /> Evolução Funcional</h3>
                                                <div className="h-80 w-full bg-slate-50/50 p-8 rounded-[3rem] border border-slate-100">
                                                    {selectedPatient.evaluations.length > 1 ? (
                                                        <ResponsiveContainer width="100%" height="100%">
                                                            <LineChart data={selectedPatient.evaluations}>
                                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                                <XAxis dataKey="date" fontSize={10} axisLine={false} tickLine={false} />
                                                                <YAxis fontSize={10} axisLine={false} tickLine={false} />
                                                                <Tooltip />
                                                                <Legend iconType="circle" />
                                                                <Line type="monotone" dataKey="barthel" name="Barthel" stroke="#10b981" strokeWidth={6} dot={{r: 8, fill: '#10b981', strokeWidth: 3, stroke: '#fff'}} />
                                                                <Line type="monotone" dataKey="sts" name="STS" stroke="#3b82f6" strokeWidth={6} dot={{r: 8, fill: '#3b82f6', strokeWidth: 3, stroke: '#fff'}} />
                                                            </LineChart>
                                                        </ResponsiveContainer>
                                                    ) : (
                                                        <div className="h-full flex flex-col items-center justify-center text-slate-300 gap-4">
                                                            <Icon name="bar-chart-3" size={48} className="opacity-20" />
                                                            <p className="text-sm font-bold opacity-60 text-center">Gráfico disponível após<br/>2 avaliações</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="space-y-6">
                                                <div className="bg-emerald-600 text-white p-10 rounded-[3rem] shadow-2xl flex flex-col justify-center text-center h-full">
                                                    <p className="text-[11px] font-black opacity-60 uppercase mb-4 tracking-widest text-center">Barthel Atual</p>
                                                    <div className="flex items-baseline justify-center gap-2">
                                                        <h4 className="text-8xl font-black">{selectedPatient.evaluations.length > 0 ? selectedPatient.evaluations.at(-1).barthel : '00'}</h4>
                                                        <span className="text-xl opacity-60 font-bold">/100</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'newEval' && selectedPatient && (
                                <div className="max-w-4xl mx-auto space-y-8 pb-32 fade-in">
                                    <header className="flex items-center gap-5 bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-50">
                                        <button onClick={() => setActiveTab('profile')} className="p-3 bg-slate-50 rounded-2xl text-slate-500 hover:text-emerald-600 transition-all"><Icon name="arrow-left" size={24} /></button>
                                        <div>
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Avaliar Paciente</p>
                                            <h2 className="text-xl font-black text-slate-800">{selectedPatient.name}</h2>
                                        </div>
                                    </header>

                                    <form onSubmit={handleSaveEvaluation} className="space-y-8">
                                        <section className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="font-black text-slate-800 mb-10 border-b border-slate-50 pb-6 flex items-center gap-3 text-xs uppercase tracking-widest">
                                                <Icon name="stethoscope" className="text-emerald-500"/> Sinais Vitais e Biometria
                                            </h3>
                                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-8">
                                                {[
                                                    {id:'sys',l:'PA Sistólica',p:'120'}, {id:'dia',l:'PA Diastólica',p:'80'}, 
                                                    {id:'weight',l:'Peso (kg)',p:'75.0'}, {id:'echo',l:'ECO Músculo',p:'1.2'}
                                                ].map(f => (
                                                    <div key={f.id} className="space-y-2">
                                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">{f.l}</label>
                                                        <input 
                                                            type="text" inputMode="decimal" placeholder={f.p}
                                                            className="w-full p-5 bg-slate-50 border-none rounded-2xl outline-none font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500" 
                                                            value={newEval[f.id]} onChange={e => setNewEval({...newEval, [f.id]: e.target.value})} 
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-10">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block ml-1">Teste Senta e Levanta (30 seg)</label>
                                                <input 
                                                    type="number" className="w-full p-8 bg-slate-50 border-none rounded-[2rem] outline-none font-black text-5xl text-emerald-600 focus:ring-2 focus:ring-emerald-500 text-center" 
                                                    value={newEval.sts} onChange={e => setNewEval({...newEval, sts: e.target.value})} 
                                                />
                                            </div>
                                        </section>

                                        <section className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="font-black text-slate-800 mb-10 border-b border-slate-50 pb-6 text-xs uppercase tracking-widest">Escala de Barthel</h3>
                                            <div className="grid gap-4">
                                                {[
                                                    {id:'alimentacao',l:'Alimentação',o:[0,5,10]}, {id:'banho',l:'Banho',o:[0,5]}, {id:'higiene',l:'Higiene Pessoal',o:[0,5]},
                                                    {id:'vestir',l:'Vestir-se',o:[0,5,10]}, {id:'intestino',l:'Intestino',o:[0,5,10]}, {id:'bexiga',l:'Bexiga',o:[0,5,10]},
                                                    {id:'banheiro',l:'Uso do Banheiro',o:[0,5,10]}, {id:'transferencia',l:'Transferências',o:[0,5,10,15]}, {id:'mobilidade',l:'Mobilidade',o:[0,5,10,15]}, {id:'escadas',l:'Escadas',o:[0,5,10]}
                                                ].map(item => (
                                                    <div key={item.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-6 bg-slate-50/50 rounded-[2rem] border border-slate-50 gap-4">
                                                        <span className="text-sm font-bold text-slate-700">{item.l}</span>
                                                        <div className="flex gap-2">
                                                            {item.o.map(v => (
                                                                <button 
                                                                    key={v} type="button" 
                                                                    onClick={() => handleBarthelClick(item.id, v)} 
                                                                    className={`w-14 h-14 rounded-2xl text-xs font-black transition-all ${newEval.barthel[item.id] === v ? 'barthel-btn-active' : 'bg-white text-slate-300 border border-slate-100'}`}
                                                                >
                                                                    {v}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                                <div className="mt-10 p-10 bg-emerald-600 rounded-[2.5rem] text-white flex justify-between items-center shadow-2xl">
                                                    <span className="font-black uppercase text-xs tracking-widest opacity-70">Barthel Total</span>
                                                    <span className="text-6xl font-black">{calculateBarthel(newEval.barthel)} <span className="text-xl opacity-50 font-normal">pts</span></span>
                                                </div>
                                            </div>
                                        </section>

                                        <section className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="font-black text-slate-800 mb-10 border-b border-slate-50 pb-6 text-xs uppercase tracking-widest">Diagnóstico Funcional</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                {functionalOptions.map(opt => (
                                                    <button key={opt} type="button" onClick={() => handleFunctionalToggle(opt)} className={`flex items-center gap-5 p-6 rounded-2xl border-2 transition-all text-left ${newEval.functionalChecks.includes(opt) ? 'bg-emerald-50 border-emerald-600 text-emerald-800 font-bold' : 'bg-white border-slate-100 text-slate-300 font-medium'}`}>
                                                        <Icon name={newEval.functionalChecks.includes(opt) ? "check-circle-2" : "circle"} className={newEval.functionalChecks.includes(opt) ? "text-emerald-600" : "opacity-30"} />
                                                        <span className="text-sm">{opt}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <textarea 
                                                placeholder="Notas de evolução e conduta..."
                                                className="w-full mt-12 p-8 bg-slate-50 border-none rounded-[2.5rem] h-56 text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700"
                                                value={newEval.notes} onChange={e => setNewEval({...newEval, notes: e.target.value})}
                                            />
                                        </section>

                                        <button type="submit" disabled={isSaving} className={`w-full py-10 rounded-[2.5rem] font-black text-2xl shadow-2xl transition-all flex items-center justify-center gap-4 ${isSaving ? 'bg-slate-400' : 'bg-slate-900 hover:bg-black text-white active:scale-95'}`}>
                                            {isSaving ? <Icon name="loader" className="animate-spin" /> : <Icon name="save" size={32} />}
                                            {isSaving ? "PROCESSANDO..." : "FINALIZAR E ENVIAR PLANILHA"}
                                        </button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'newPatient' && (
                                <div className="max-w-2xl mx-auto bg-white p-12 rounded-[3.5rem] shadow-sm border border-slate-100 fade-in">
                                    <h2 className="text-4xl font-black text-slate-900 mb-10 tracking-tight leading-none text-center">Novo Cadastro</h2>
                                    <form onSubmit={(e) => { e.preventDefault(); setPatients([...patients, {...newPatient, id: Date.now(), status: 'active', evaluations: [], createdAt: new Date().toISOString().split('T')[0]}]); setActiveTab('patients'); setNewPatient({ name: '', age: '', clinicalDiagnosis: '' }); }} className="space-y-8">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-3">Nome Completo</label>
                                            <input required placeholder="Ex: Francisco Santos" className="w-full p-6 bg-slate-50 border-none rounded-[1.8rem] outline-none font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500" value={newPatient.name} onChange={e => setNewPatient({...newPatient, name: e.target.value})} />
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-3">Diagnóstico / CID</label>
                                            <input required placeholder="Ex: Parkinson" className="w-full p-6 bg-slate-50 border-none rounded-[1.8rem] outline-none font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500" value={newPatient.clinicalDiagnosis} onChange={e => setNewPatient({...newPatient, clinicalDiagnosis: e.target.value})} />
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-3">Idade</label>
                                            <input type="number" placeholder="Ex: 72" className="w-full p-6 bg-slate-50 border-none rounded-[1.8rem] outline-none font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500" value={newPatient.age} onChange={e => setNewPatient({...newPatient, age: e.target.value})} />
                                        </div>
                                        <div className="pt-6 flex flex-col gap-4">
                                            <button type="submit" className="w-full py-6 bg-emerald-600 text-white rounded-[2rem] font-black shadow-xl shadow-emerald-50 hover:bg-emerald-700 transition-all uppercase tracking-widest text-xs">CADASTRAR E ABRIR PRONTUÁRIO</button>
                                            <button type="button" onClick={() => setActiveTab('patients')} className="w-full py-4 text-slate-400 font-bold uppercase tracking-widest text-xs hover:text-slate-600">CANCELAR</button>
                                        </div>
                                    </form>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
