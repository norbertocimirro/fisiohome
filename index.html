<!DOCTYPE html>
<html lang="pt-br" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FisioHome Pro | HealthTech</title>
    
    <!-- Meta Tags PWA iOS/Android (App Nativo) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Crossorigin previne bloqueios de segurança no Vercel) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
            --safe-area-pt: env(safe-area-inset-top, 0px);
        }

        body, html { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Evita o "bounce" ao rolar no iOS */
        }

        /* Oculta scrollbar mas mantém a rolagem suave */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Otimização de Inputs - Previne Zoom em iPhones */
        input, button, textarea { 
            outline: none !important; 
            appearance: none; 
            font-size: 16px !important; 
        }
        
        .premium-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0,0,0,0.02);
        }
        
        .premium-shadow-hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 5px rgba(0,0,0,0.03);
        }

        .input-soft {
            background-color: #f1f5f9;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .input-soft:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* Animações Flúidas */
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilos do Sistema */
        .barthel-btn-active {
            background-color: #10b981 !important;
            color: white !important;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.5);
            transform: scale(1.08);
            border-color: #10b981 !important;
        }

        /* Switch LGPD */
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }

        /* Layout Responsivo Masterpiece */
        .app-layout { display: flex; min-height: 100vh; flex-direction: column; }
        
        /* Mobile First Layout */
        .desktop-sidebar { display: none; }
        .mobile-content { 
            flex: 1; 
            width: 100%; 
            padding-top: calc(5.5rem + var(--safe-area-pt)); 
            padding-bottom: calc(8rem + var(--safe-area-pb)); 
        }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: 5rem;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6); 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; z-index: 50;
            padding-top: var(--safe-area-pt);
        }

        /* Dynamic Island Flutuante no Mobile */
        .floating-nav {
            position: fixed; bottom: calc(1.5rem + var(--safe-area-pb)); 
            left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem; padding: 0.75rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
            z-index: 50;
        }

        .fab-center {
            background: linear-gradient(135deg, #10b981, #059669);
            transform: translateY(-40%);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            border: 4px solid var(--bg-app);
        }

        /* Desktop Layout (Telas Grandes) */
        @media (min-width: 1024px) {
            .app-layout { flex-direction: row; }
            .desktop-sidebar { 
                display: flex; flex-direction: column; width: 320px; 
                position: fixed; top: 0; bottom: 0; left: 0;
                background: #ffffff; border-right: 1px solid #f1f5f9; z-index: 40;
            }
            .mobile-content { 
                margin-left: 320px; 
                padding-top: 3rem; 
                padding-bottom: 3rem; 
            }
            .mobile-only { display: none !important; }
        }

        /* Toast Notifications */
        .toast-enter { animation: toastEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(-20px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, LineChart, Line, Legend } = window.Recharts;

        // Componentes Puros e Estáveis (Declarados fora do App para evitar recriação de DOM)
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const iconRef = React.useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        attrs: { 'stroke-width': strokeWidth },
                        nameAttr: 'data-lucide'
                    });
                }
            });
            return <i ref={iconRef} data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-[2rem] p-6 lg:p-8 premium-shadow border border-slate-100/50 ${className}`}>{children}</div>
        );

        const MetricItem = ({ label, value, unit = "", highlight = false }) => (
            <div className="flex flex-col">
                <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.15em] mb-1">{label}</p>
                <p className={`text-2xl font-black ${highlight ? 'text-emerald-500' : 'text-slate-800'}`}>
                    {value} {unit && <span className="text-sm font-bold text-slate-400">{unit}</span>}
                </p>
            </div>
        );

        const App = () => {
            // --- CONFIGURAÇÃO CLOUD ---
            const GOOGLE_SCRIPT_URL = ""; 

            // --- ESTADOS GLOBAIS E AUTENTICAÇÃO ---
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authView, setAuthView] = useState('login'); 
            const [credentials, setCredentials] = useState({ user: 'wagner', pass: '123456', displayName: 'Dr. Wagner Naue' });
            const [loginInput, setLoginInput] = useState({ user: '', pass: '' });
            const [passInput, setPassInput] = useState({ old: '', new: '', confirm: '' });
            
            // --- ESTADOS DO SISTEMA ---
            const [activeView, setActiveView] = useState('dashboard'); 
            const [patientFilter, setPatientFilter] = useState('active'); 
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // MOCK DATA (Dados do Dr. Wagner)
            const [patients, setPatients] = useState([
                { 
                    id: 1, name: 'Wilson Ferreira', age: 78, clinicalDiagnosis: 'Pós-AVC Isquêmico', status: 'active', lgpdConsent: true,
                    evaluations: [
                        { date: '01/03', barthel: 45, sts: '8', tug: '18.5', sys: '140', dia: '90', weight: '75', echo: '1.2', functionalChecks: ['Redução de Força', 'Marcha Alterada'], notes: 'Início do tratamento domiciliar.' },
                        { date: '01/04', barthel: 65, sts: '12', tug: '14.2', sys: '135', dia: '85', weight: '74', echo: '1.4', functionalChecks: ['Redução de Força'], notes: 'Evolução favorável, ganho de autonomia nas transferências.' }
                    ]
                },
                { 
                    id: 2, name: 'Maria de Lurdes', age: 82, clinicalDiagnosis: 'Alzheimer / Fratura Fêmur', status: 'active', lgpdConsent: true,
                    evaluations: [{ date: '15/02', barthel: 20, sts: '2', tug: '35.0', sys: '120', dia: '80', weight: '60', echo: '0.9', functionalChecks: ['Incapacidade de Transferência'], notes: 'Paciente acamada. Risco de queda alto.' }]
                }
            ]);

            const [evalForm, setEvalForm] = useState({
                sys: '', dia: '', weight: '', echo: '', tug: '', sts: '',
                barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                functionalChecks: [], notes: ''
            });

            const [newPatientForm, setNewPatientForm] = useState({ name: '', age: '', clinicalDiagnosis: '', lgpdConsent: false });

            const checklistOptions = [
                "Redução de Força Muscular", "Redução de ADM", "Déficit de Equilíbrio",
                "Alteração de Sensibilidade", "Marcha Alterada", "Incapacidade de Transferência", 
                "Dor ao Movimento", "Espasticidade", "Encurtamento Muscular"
            ];

            // --- LÓGICA CLÍNICA E ESTATÍSTICAS ---
            const selectedPatient = useMemo(() => patients.find(p => p.id === selectedPatientId), [patients, selectedPatientId]);
            const calcBarthel = (b) => Object.values(b).reduce((acc, curr) => acc + parseInt(curr), 0);

            const stats = useMemo(() => {
                const ativos = patients.filter(p => p.status === 'active').length;
                const arquivo = patients.filter(p => p.status === 'archived').length;
                const avaliacoes = patients.reduce((acc, p) => acc + p.evaluations.length, 0);
                const pacsComEvolucao = patients.filter(p => p.status === 'active' && p.evaluations.length > 0);
                const mediaBarthel = pacsComEvolucao.length > 0 ? (pacsComEvolucao.reduce((acc, p) => acc + p.evaluations.at(-1).barthel, 0) / pacsComEvolucao.length).toFixed(0) : 0;
                
                // Mock de gráfico mensal
                const grafico = [{ mes: 'Jan', val: 3 }, { mes: 'Fev', val: 5 }, { mes: 'Mar', val: ativos }];
                return { ativos, arquivo, avaliacoes, mediaBarthel, grafico };
            }, [patients]);

            // --- HANDLERS (AÇÕES) ---
            const handleAuth = (e) => {
                e.preventDefault();
                const userMatch = loginInput.user.toLowerCase().includes('wagner') || loginInput.user.toLowerCase() === 'admin';
                if (userMatch && loginInput.pass === credentials.pass) {
                    setIsAuthenticated(true);
                    setLoginInput({ user: '', pass: '' });
                } else {
                    showToast('Credenciais de acesso inválidas. Tente novamente.', 'error');
                }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                if (passInput.old !== credentials.pass) { showToast('Senha atual está incorreta.', 'error'); return; }
                if (passInput.new !== passInput.confirm) { showToast('As novas senhas não coincidem.', 'error'); return; }
                if (passInput.new.length < 6) { showToast('A senha deve ter no mínimo 6 caracteres.', 'error'); return; }
                
                setCredentials({ ...credentials, pass: passInput.new });
                showToast('Senha atualizada com segurança!', 'success');
                setTimeout(() => {
                    setAuthView('login');
                    setPassInput({ old: '', new: '', confirm: '' });
                }, 1500);
            };

            const handleSaveEvaluation = async (e) => {
                e.preventDefault();
                if (!selectedPatient) return;
                setIsLoading(true);
                
                const score = calcBarthel(evalForm.barthel);
                const evaluationData = {
                    date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}),
                    ...evalForm, barthel: score
                };

                const updatedPatients = patients.map(p => p.id === selectedPatientId ? { ...p, evaluations: [...p.evaluations, evaluationData] } : p);
                
                try {
                    if (GOOGLE_SCRIPT_URL) {
                        await fetch(GOOGLE_SCRIPT_URL, { 
                            method: 'POST', mode: 'no-cors', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ ...evaluationData, patientName: selectedPatient.name, clinicalDiagnosis: selectedPatient.clinicalDiagnosis }) 
                        });
                    }
                    setTimeout(() => {
                        setPatients(updatedPatients);
                        setActiveView('profile');
                        setEvalForm({ sys: '', dia: '', weight: '', echo: '', tug: '', sts: '', barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 }, functionalChecks: [], notes: '' });
                        setIsLoading(false);
                        showToast('Avaliação salva e prontuário atualizado.', 'success');
                    }, 800);
                } catch (error) {
                    setPatients(updatedPatients);
                    setActiveView('profile');
                    setIsLoading(false);
                    showToast('Salvo no dispositivo. Erro ao sincronizar nuvem.', 'error');
                }
            };

            const handleCreatePatient = (e) => {
                e.preventDefault();
                if(!newPatientForm.name) return;
                const newId = Date.now();
                setPatients([...patients, { ...newPatientForm, id: newId, status: 'active', evaluations: [], createdAt: new Date().toISOString().split('T')[0] }]);
                setNewPatientForm({ name: '', age: '', clinicalDiagnosis: '', lgpdConsent: false });
                setSelectedPatientId(newId);
                setActiveView('profile');
                showToast('Prontuário criado e auditado com sucesso.', 'success');
            };

            const toggleArchivePatient = (id) => {
                setPatients(patients.map(p => p.id === id ? { ...p, status: p.status === 'active' ? 'archived' : 'active' } : p));
                setActiveView('patients');
                showToast('Status do paciente alterado com sucesso.', 'success');
            };

            const handleBarthelClick = (key, val) => setEvalForm(prev => ({ ...prev, barthel: { ...prev.barthel, [key]: val } }));
            const handleFunctionalToggle = (opt) => setEvalForm(prev => {
                const exists = prev.functionalChecks.includes(opt);
                return { ...prev, functionalChecks: exists ? prev.functionalChecks.filter(i => i !== opt) : [...prev.functionalChecks, opt] };
            });

            // --- RENDERIZADORES DE TELAS ---
            
            const renderAuthScreen = () => (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-900 relative overflow-hidden">
                    <div className="absolute top-0 w-full h-[50vh] bg-gradient-to-b from-emerald-600/40 to-slate-900 rounded-b-[40%]"></div>
                    <div className="w-full max-w-sm relative z-10 animate-slide-up">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 bg-emerald-500 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-[0_10px_30px_rgba(16,185,129,0.4)]">
                                <Icon name="activity" size={40} strokeWidth={2.5} />
                            </div>
                            <h1 className="text-4xl font-black text-white tracking-tight">Fisio<span className="text-emerald-400">Home</span></h1>
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em] mt-3">HealthTech Pro</p>
                        </div>
                        {authView === 'login' ? (
                            <form onSubmit={handleAuth} className="bg-white rounded-[2.5rem] p-8 premium-shadow space-y-5">
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Usuário de Acesso</label>
                                    <input type="text" placeholder="Dr. Wagner" required className="w-full input-soft rounded-[1.5rem] px-5 py-4 font-bold text-slate-800" value={loginInput.user} onChange={e=>setLoginInput({...loginInput, user: e.target.value})} />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Senha Segura</label>
                                    <input type="password" placeholder="••••••" required className="w-full input-soft rounded-[1.5rem] px-5 py-4 font-black tracking-widest text-emerald-600" value={loginInput.pass} onChange={e=>setLoginInput({...loginInput, pass: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-[1.5rem] font-black text-sm tracking-widest uppercase hover:bg-black transition-colors shadow-lg active:scale-[0.98] mt-4 flex justify-center items-center gap-2">
                                    ENTRAR NA CLÍNICA <Icon name="arrow-right" size={18}/>
                                </button>
                                <button type="button" onClick={() => setAuthView('change_password')} className="w-full py-3 text-xs font-bold text-slate-400 hover:text-emerald-600 transition-colors block text-center">
                                    Configurar Senha
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleChangePassword} className="bg-white rounded-[2.5rem] p-8 premium-shadow space-y-4 animate-fade-in">
                                <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                    <button type="button" onClick={() => setAuthView('login')} className="p-2 bg-slate-50 rounded-xl text-slate-500 hover:text-slate-800 transition-colors"><Icon name="arrow-left" size={18}/></button>
                                    <h3 className="font-black text-slate-800 text-lg">Atualizar Senha</h3>
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Senha Atual</label>
                                    <input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest" value={passInput.old} onChange={e => setPassInput({...passInput, old: e.target.value})} />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nova Senha</label>
                                    <input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.new} onChange={e => setPassInput({...passInput, new: e.target.value})} />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirmar Senha</label>
                                    <input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.confirm} onChange={e => setPassInput({...passInput, confirm: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black shadow-xl hover:bg-emerald-700 transition-all active:scale-[0.98] mt-4">
                                    SALVAR E VOLTAR
                                </button>
                            </form>
                        )}
                        <div className="mt-8 flex justify-center opacity-50">
                            <span className="text-[9px] font-black text-white uppercase tracking-[0.2em] flex items-center gap-1"><Icon name="shield-check" size={12}/> Auditoria LGPD Compliant</span>
                        </div>
                    </div>
                </div>
            );

            const renderDashboard = () => (
                <div className="animate-fade-in space-y-6 lg:space-y-8">
                    <header className="mb-6 lg:mb-10">
                        <h2 className="text-3xl lg:text-4xl font-black text-slate-900 tracking-tight">Gestão Clínica</h2>
                        <p className="text-sm font-medium text-slate-500 mt-1">Indicadores e produtividade mensal.</p>
                    </header>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6">
                        <Card className="flex flex-col justify-between h-40">
                            <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><Icon name="users" /></div>
                            <MetricItem label="Em Atendimento" value={stats.ativos} />
                        </Card>
                        <Card className="flex flex-col justify-between h-40 bg-emerald-600 text-white border-none shadow-[0_10px_30px_rgba(16,185,129,0.3)]">
                            <div className="w-10 h-10 bg-white/20 text-white rounded-2xl flex items-center justify-center"><Icon name="trending-up" /></div>
                            <div>
                                <p className="text-[10px] font-black text-emerald-100 uppercase tracking-[0.15em] mb-1">Média Barthel</p>
                                <p className="text-4xl font-black">{stats.mediaBarthel}</p>
                            </div>
                        </Card>
                        <Card className="flex flex-col justify-between h-40">
                            <div className="w-10 h-10 bg-slate-100 text-slate-500 rounded-2xl flex items-center justify-center"><Icon name="archive" /></div>
                            <MetricItem label="Prontuários Arquivados" value={stats.arquivo} />
                        </Card>
                        <Card className="flex flex-col justify-between h-40">
                            <div className="w-10 h-10 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center"><Icon name="clipboard-check" /></div>
                            <MetricItem label="Total de Avaliações" value={stats.avaliacoes} />
                        </Card>
                    </div>

                    <Card>
                        <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-2">
                            <Icon name="bar-chart-2" size={16} className="text-emerald-500"/> Fluxo de Pacientes
                        </h3>
                        <div className="h-64 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={stats.grafico}>
                                    <defs>
                                        <linearGradient id="colorVal" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#10b981" stopOpacity={0.25}/>
                                            <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <XAxis dataKey="mes" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b', fontWeight: 600}} dy={10} />
                                    <Tooltip cursor={{stroke: '#e2e8f0', strokeWidth: 2}} contentStyle={{borderRadius:'16px', border:'none', boxShadow:'0 10px 30px rgba(0,0,0,0.08)'}} />
                                    <Area type="monotone" dataKey="val" stroke="#10b981" strokeWidth={4} fillOpacity={1} fill="url(#colorVal)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                    </Card>
                </div>
            );

            const renderPatientsList = () => (
                <div className="animate-fade-in flex flex-col h-full space-y-6">
                    <header>

                                    <p className="text-[9px] text-emerald-600 uppercase font-black tracking-widest mt-0.5">Sócio Proprietário</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="mobile-content">
                        <div className="max-w-6xl mx-auto">
                            {activeView === 'management' && renderDashboard()}
                            {activeView === 'patients' && renderPatientsList()}
                            {activeView === 'profile' && renderProfile()}
                            {activeView === 'eval' && renderEvalForm()}
                            {activeView === 'new_patient' && renderNewPatient()}
                        </div>
                    </main>

                    {/* Mobile Dynamic Island Nav */}
                    {['management', 'patients'].includes(activeView) && (
                        <nav className="floating-nav mobile-only">
                            <button onClick={() => setActiveView('management')} className={`p-3 rounded-full transition-colors ${activeView === 'management' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="layout-dashboard" size={24} />
                            </button>
                            <button onClick={() => setActiveView('new_patient')} className="w-14 h-14 rounded-full fab-center text-white flex items-center justify-center">
                                <Icon name="plus" size={28}/>
                            </button>
                            <button onClick={() => setActiveView('patients')} className={`p-3 rounded-full transition-colors ${activeView === 'patients' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="users" size={24} />
                            </button>
                        </nav>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
