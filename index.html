<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FisioHome Pro | Masterpiece</title>
    
    <!-- Meta Tags para PWA (App Nativo) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-app: #f8fafc;
            --primary: #10b981;
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
        }

        body, html { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-app);
            -webkit-tap-highlight-color: transparent;
            color: #0f172a;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* Otimização Inputs Mobile */
        input, button, select, textarea {
            font-size: 16px !important; 
            outline: none !important;
            appearance: none;
        }

        /* Esconde scrollbar nativa */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animações Ultra-suaves */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.99); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Design System Premium */
        .card-premium {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 0 3px rgba(0,0,0,0.02);
            border-radius: 2rem;
            transition: all 0.3s ease;
        }
        
        .card-premium:hover {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06);
        }

        .input-premium {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }
        .input-premium:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        /* Botão Escala Barthel */
        .barthel-btn-active {
            background-color: #10b981 !important;
            color: white !important;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.5);
            transform: scale(1.08);
            border-color: #10b981 !important;
        }

        /* Toggle LGPD Switch */
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }

        /* Estrutura de Layout Masterpiece */
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Mobile First: Espaços de segurança para menus fixos */
        .main-content { 
            flex: 1; 
            width: 100%; 
            padding-top: 6rem; /* Header mobile */
            padding-bottom: 9rem; /* Nav bottom mobile */
        }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: 5rem;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6); 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; z-index: 50;
            padding-top: env(safe-area-inset-top); /* Para notch do iPhone */
        }

        .floating-nav {
            position: fixed; bottom: calc(1.5rem + var(--safe-area-pb)); 
            left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem; padding: 0.75rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
            z-index: 50;
        }

        .fab-center {
            background: linear-gradient(135deg, #10b981, #059669);
            transform: translateY(-40%);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            border: 4px solid var(--bg-app);
        }

        /* Desktop Layout (> 1024px) */
        @media (min-width: 1024px) {
            .app-container { flex-direction: row; }
            .sidebar-desktop { 
                width: 18rem; position: fixed; height: 100vh; left: 0; top: 0; z-index: 40; 
                background: white; border-right: 1px solid #e2e8f0;
            }
            .main-content { 
                margin-left: 18rem; /* Previne sobreposição perfeitamente */
                padding-top: 3rem; padding-bottom: 3rem; 
                max-width: calc(100% - 18rem); /* Limita o crescimento */
            }
            .mobile-header, .floating-nav { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, Legend } = window.Recharts;

        const Icon = ({ name, size = 20, className = "" }) => (
            <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>
        );

        const App = () => {
            // --- CONFIGURAÇÃO ---
            const GOOGLE_SCRIPT_URL = ""; 

            // --- ESTADOS DE AUTENTICAÇÃO ---
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authView, setAuthView] = useState('login'); 
            const [credentials, setCredentials] = useState({ user: 'wagner', pass: '123456', displayName: 'Dr. Wagner Naue' });
            const [loginInput, setLoginInput] = useState({ user: '', pass: '' });
            const [passInput, setPassInput] = useState({ old: '', new: '', confirm: '' });
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');

            // --- ESTADOS DO SISTEMA ---
            const [activeTab, setActiveTab] = useState('management'); 
            const [patientFilter, setPatientFilter] = useState('active'); 
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            // MOCK DATA
            const [patients, setPatients] = useState([
                { 
                    id: 1, name: 'Wilson Ferreira', age: 78, clinicalDiagnosis: 'Pós-AVC Isquêmico', status: 'active', createdAt: '2024-01-15', lgpdConsent: true,
                    evaluations: [
                        { date: '01/03', barthel: 45, sts: 8, tug: '18.5', sys: '140', dia: '90', weight: '75', echo: '1.2', functionalChecks: ['Redução de Força', 'Marcha Alterada'] },
                        { date: '01/04', barthel: 65, sts: 12, tug: '14.2', sys: '132', dia: '84', weight: '74', echo: '1.4', functionalChecks: ['Redução de Força'] }
                    ]
                },
                { 
                    id: 2, name: 'Maria de Lurdes', age: 82, clinicalDiagnosis: 'Alzheimer / Fratura Fêmur', status: 'active', createdAt: '2024-02-10', lgpdConsent: true,
                    evaluations: [{ date: '15/02', barthel: 20, sts: 2, tug: '35.0', sys: '120', dia: '80', weight: '60', echo: '0.9', functionalChecks: ['Incapacidade de Transferência'] }]
                }
            ]);

            const [newPatient, setNewPatient] = useState({ name: '', age: '', clinicalDiagnosis: '', lgpdConsent: false });
            const [newEval, setNewEval] = useState({
                date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}),
                sys: '', dia: '', weight: '', echo: '',
                barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                sts: '', tug: '', functionalChecks: [], notes: ''
            });

            const functionalOptions = [
                "Redução de Força Muscular", "Redução de ADM", "Déficit de Equilíbrio",
                "Alteração de Sensibilidade", "Marcha Alterada", "Incapacidade de Transferência", 
                "Dor ao Movimento", "Espasticidade", "Encurtamento Muscular"
            ];

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            // --- LÓGICA DE AUTENTICAÇÃO ---
            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const userMatch = loginInput.user.toLowerCase().includes('wagner') || loginInput.user.toLowerCase() === 'admin';
                if (userMatch && loginInput.pass === credentials.pass) {
                    setIsAuthenticated(true);
                } else {
                    setAuthError('Credenciais inválidas. Tente novamente.');
                }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setAuthError(''); setAuthSuccess('');
                if (passInput.old !== credentials.pass) { setAuthError('Senha atual incorreta.'); return; }
                if (passInput.new !== passInput.confirm) { setAuthError('Senhas não coincidem.'); return; }
                if (passInput.new.length < 6) { setAuthError('Mínimo de 6 caracteres.'); return; }
                
                setCredentials({ ...credentials, pass: passInput.new });
                setAuthSuccess('Senha atualizada com sucesso!');
                setTimeout(() => {
                    setAuthView('login');
                    setPassInput({ old: '', new: '', confirm: '' });
                    setAuthSuccess('');
                }, 2000);
            };

            // --- CALCULOS ---
            const stats = useMemo(() => {
                const active = patients.filter(p => p.status === 'active').length;
                const archived = patients.filter(p => p.status === 'archived').length;
                const totalEvals = patients.reduce((acc, p) => acc + p.evaluations.length, 0);
                const activeWithEval = patients.filter(p => p.status === 'active' && p.evaluations.length > 0);
                const avgBarthel = activeWithEval.length > 0 
                    ? (activeWithEval.reduce((acc, p) => acc + (p.evaluations.at(-1).barthel || 0), 0) / activeWithEval.length).toFixed(0)
                    : 0;

                const monthlyData = [
                    { mes: 'Jan', ativos: 5 }, { mes: 'Fev', ativos: 8 }, { mes: 'Mar', ativos: active }
                ];
                return { active, archived, totalEvals, avgBarthel, monthlyData };
            }, [patients]);

            const selectedPatient = useMemo(() => patients.find(p => p.id === selectedPatientId), [patients, selectedPatientId]);
            const calculateBarthel = (b) => Object.values(b).reduce((acc, curr) => acc + parseInt(curr), 0);

            // --- HANDLERS APP ---
            const handleSaveEvaluation = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const score = calculateBarthel(newEval.barthel);
                
                const evaluationData = {
                    ...newEval, barthelScore: score, patientName: selectedPatient.name, clinicalDiagnosis: selectedPatient.clinicalDiagnosis
                };
                const updated = patients.map(p => p.id === selectedPatientId ? { ...p, evaluations: [...p.evaluations, { ...newEval, barthel: score }] } : p);
                
                try {
                    if (GOOGLE_SCRIPT_URL) {
                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(evaluationData) });
                    }
                    setTimeout(() => {
                        setPatients(updated);
                        setActiveTab('profile');
                        setNewEval({
                            date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}),
                            sys: '', dia: '', weight: '', echo: '',
                            barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                            sts: '', tug: '', functionalChecks: [], notes: ''
                        });
                        setIsSaving(false);
                    }, 600);
                } catch (error) {
                    setPatients(updated);
                    setActiveTab('profile');
                    setIsSaving(false);
                }
            };

            const toggleArchivePatient = (id) => {
                setPatients(patients.map(p => p.id === id ? { ...p, status: p.status === 'active' ? 'archived' : 'active' } : p));
                setActiveTab('patients');
            };

            const handleBarthelClick = (key, val) => setNewEval(prev => ({ ...prev, barthel: { ...prev.barthel, [key]: val } }));
            const handleFunctionalToggle = (opt) => setNewEval(prev => {
                const exists = prev.functionalChecks.includes(opt);
                return { ...prev, functionalChecks: exists ? prev.functionalChecks.filter(i => i !== opt) : [...prev.functionalChecks, opt] };
            });

            // --- TELA DE LOGIN PREMIUM ---
            const renderAuthScreen = () => (
                <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 bg-slate-900 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-[50vh] bg-gradient-to-b from-emerald-600 to-slate-900 rounded-b-[40%] opacity-50"></div>
                    
                    <div className="w-full max-w-sm bg-white rounded-[2.5rem] p-8 relative z-10 slide-up-fade shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-slate-900 text-white rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-2xl shadow-emerald-500/30">
                                <Icon name="stethoscope" size={40} />
                            </div>
                            <h1 className="text-3xl font-black text-slate-900 tracking-tighter">Fisio<span className="text-emerald-600">Home</span></h1>
                            <p className="text-[9px] font-black uppercase tracking-[0.4em] text-slate-400 mt-2">HealthTech Pro</p>
                        </div>

                        {authView === 'login' ? (
                            <form onSubmit={handleLogin} className="space-y-5">
                                {authError && <div className="p-3 bg-red-50 border border-red-100 text-red-600 rounded-xl text-xs font-bold text-center animate-pulse">{authError}</div>}
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Usuário / Login</label>
                                    <input type="text" placeholder="Ex: Wagner" required className="w-full input-premium rounded-2xl px-5 py-4 font-bold text-slate-800" value={loginInput.user} onChange={e => setLoginInput({...loginInput, user: e.target.value})} />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Senha de Acesso</label>
                                    <input type="password" placeholder="••••••" required className="w-full input-premium rounded-2xl px-5 py-4 font-black text-slate-800 tracking-widest" value={loginInput.pass} onChange={e => setLoginInput({...loginInput, pass: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black shadow-xl shadow-emerald-600/30 hover:bg-emerald-700 transition-all active:scale-[0.98] mt-6 flex items-center justify-center gap-2">
                                    ENTRAR NA CLÍNICA <Icon name="arrow-right" size={18} />
                                </button>
                                <button type="button" onClick={() => setAuthView('change_password')} className="w-full py-3 text-xs font-bold text-slate-400 hover:text-emerald-600 transition-colors">
                                    Configurar Senha
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleChangePassword} className="space-y-4 fade-in">
                                <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                    <button type="button" onClick={() => setAuthView('login')} className="p-2 bg-slate-50 rounded-xl text-slate-500 hover:text-slate-800 transition-colors"><Icon name="arrow-left" size={18}/></button>
                                    <h3 className="font-black text-slate-800 text-lg">Atualizar Senha</h3>
                                </div>
                                {authError && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold text-center">{authError}</div>}
                                {authSuccess && <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-bold text-center">{authSuccess}</div>}
                                
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Senha Atual</label>
                                    <input type="password" required className="w-full input-premium rounded-2xl px-5 py-3 font-black tracking-widest" value={passInput.old} onChange={e => setPassInput({...passInput, old: e.target.value})} />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nova Senha</label>
                                    <input type="password" required className="w-full input-premium rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.new} onChange={e => setPassInput({...passInput, new: e.target.value})} />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirmar Senha</label>
                                    <input type="password" required className="w-full input-premium rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.confirm} onChange={e => setPassInput({...passInput, confirm: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black shadow-xl hover:bg-black transition-all active:scale-[0.98] mt-4">
                                    SALVAR E VOLTAR
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );

            // --- TELAS DO SISTEMA (DASHBOARD) ---
            const renderManagement = () => (
                <div className="fade-in space-y-6 lg:space-y-8">
                    <header className="mb-4 lg:mb-8">
                        <h2 className="text-3xl lg:text-4xl font-black text-slate-900 tracking-tight">Painel de Gestão</h2>
                        <p className="text-slate-500 font-medium text-sm mt-1 flex items-center gap-2">
                            <Icon name="check-circle-2" size={14} className="text-emerald-500"/> Visão geral da produtividade
                        </p>
                    </header>

                    {/* Cards Superiores */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="card-premium p-6 flex flex-col justify-between h-36">
                            <Icon name="activity" className="text-blue-500" size={24}/>
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Pacientes Ativos</p>
                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.active}</h4>
                            </div>
                        </div>
                        <div className="card-premium p-6 flex flex-col justify-between h-36 border-l-4 border-l-emerald-500 bg-emerald-50/30">
                            <Icon name="trending-up" className="text-emerald-600" size={24}/>
                            <div>
                                <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Média Barthel</p>
                                <h4 className="text-4xl font-black text-emerald-600 leading-none mt-1">{stats.avgBarthel}</h4>
                            </div>
                        </div>
                        <div className="card-premium p-6 flex flex-col justify-between h-36">
                            <Icon name="folder-check" className="text-slate-400" size={24}/>
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Arquivo</p>
                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.archived}</h4>
                            </div>
                        </div>
                        <div className="card-premium p-6 flex flex-col justify-between h-36">
                            <Icon name="clipboard-list" className="text-purple-500" size={24}/>
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Avaliações (Mês)</p>
                                <h4 className="text-4xl font-black text-slate-900 leading-none mt-1">{stats.totalEvals}</h4>
                            </div>
                        </div>
                    </div>

                    {/* Gráfico */}
                    <div className="card-premium p-6 lg:p-8">
                        <h3 className="text-xs font-black text-slate-800 mb-8 uppercase tracking-widest flex items-center gap-2">
                            <Icon name="bar-chart-2" size={18} className="text-emerald-500" /> Fluxo de Atendimentos Mensais
                        </h3>
                        <div className="h-64 lg:h-80 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={stats.monthlyData}>
                                    <defs>
                                        <linearGradient id="colorActive" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#10b981" stopOpacity={0.25}/>
                                            <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <XAxis dataKey="mes" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b', fontWeight: 600}} dy={10} />
                                    <Tooltip cursor={{stroke: '#e2e8f0', strokeWidth: 2}} contentStyle={{borderRadius:'16px', border:'none', boxShadow:'0 10px 30px rgba(0,0,0,0.08)'}} />
                                    <Area type="monotone" dataKey="ativos" stroke="#10b981" strokeWidth={4} fillOpacity={1} fill="url(#colorActive)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );

            const renderPatientsList = () => (
                <div className="fade-in flex flex-col min-h-full space-y-6">
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-3xl lg:text-4xl font-black text-slate-900 tracking-tight">Prontuários</h2>
                            <div className="flex bg-slate-200/50 p-1.5 rounded-[1rem] mt-3 w-max">
                                <button onClick={() => setPatientFilter('active')} className={`px-6 py-2 text-xs font-black uppercase tracking-widest rounded-xl transition-all ${patientFilter === 'active' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>Ativos</button>
                                <button onClick={() => setPatientFilter('archived')} className={`px-6 py-2 text-xs font-black uppercase tracking-widest rounded-xl transition-all ${patientFilter === 'archived' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>Arquivo</button>
                            </div>
                        </div>
                    </header>

                    <div className="relative group">
                        <Icon name="search" size={20} className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-emerald-500 transition-colors" />
                        <input 
                            type="text" placeholder="Procurar paciente..." 
                            className="w-full pl-16 pr-6 py-5 card-premium border-none outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all font-bold text-slate-700 text-lg"

                            </button>
                            <button onClick={() => {setActiveTab('patients'); setSelectedPatientId(null);}} className={`w-full flex items-center gap-4 px-6 py-4 rounded-[1.2rem] font-black text-xs uppercase tracking-widest transition-all ${activeTab === 'patients' ? 'bg-emerald-50 text-emerald-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="users" size={18} /> PACIENTES
                            </button>
                        </nav>
                        <div className="mt-auto">
                            <div className="p-5 bg-slate-50 rounded-[2rem] border border-slate-100 mb-6">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 font-black shadow-sm">
                                        {credentials.displayName.split(' ').map(n => n[0]).slice(0, 2).join('')}
                                    </div>
                                    <div className="leading-tight">
                                        <p className="text-xs font-black text-slate-800 truncate w-32">{credentials.displayName}</p>
                                        <p className="text-[9px] text-slate-500 uppercase font-black tracking-widest mt-1">Sócio Clínico</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 border-t border-slate-200 pt-4">
                                    <span className={`w-2 h-2 rounded-full ${GOOGLE_SCRIPT_URL ? 'bg-emerald-500 animate-pulse' : 'bg-red-400'}`}></span>
                                    <span className="text-[9px] font-black uppercase tracking-widest text-slate-500">Cloud Sync</span>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Nav Inferior Flutuante Mobile Oculta no Desktop */}
                    {['management', 'patients'].includes(activeTab) && (
                        <nav className="floating-nav md:hidden">
                            <button onClick={() => setActiveTab('management')} className={`p-3 rounded-full transition-colors ${activeTab === 'management' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="layout-dashboard" size={24} />
                            </button>
                            <button onClick={() => setActiveTab('newPatient')} className="p-4 rounded-full fab-center text-white flex items-center justify-center active:scale-90 transition-transform">
                                <Icon name="plus" size={32}/>
                            </button>
                            <button onClick={() => setActiveTab('patients')} className={`p-3 rounded-full transition-colors ${activeTab === 'patients' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="users" size={24} />
                            </button>
                        </nav>
                    )}

                    {/* Container Dinâmico Principal */}
                    <main className="main-content">
                        {activeTab === 'management' && renderManagement()}
                        {activeTab === 'patients' && renderPatientsList()}
                        {activeTab === 'profile' && renderProfile()}
                        {activeTab === 'newEval' && renderNewEval()}
                        {activeTab === 'newPatient' && renderNewPatient()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
