<!DOCTYPE html>
<html lang="pt-br" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FisioHome Pro | HealthTech</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f8fafc">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-area-pb: env(safe-area-inset-bottom, 20px);
            --safe-area-pt: env(safe-area-inset-top, 0px);
        }

        body, html { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        input, button, textarea { outline: none !important; appearance: none; font-size: 16px !important; }
        
        .premium-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0,0,0,0.02); }
        .card-premium {
            background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 0 3px rgba(0,0,0,0.02);
            border-radius: 2rem; transition: all 0.3s ease;
        }

        .input-soft { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; }
        .input-soft:focus { background-color: #ffffff; border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }

        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .barthel-btn-active {
            background-color: #10b981 !important; color: white !important;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.5);
            transform: scale(1.05); border-color: #10b981 !important;
        }
        
        .font-digital { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

        .app-layout { display: flex; min-height: 100vh; flex-direction: column; }
        .desktop-sidebar { display: none; }
        .mobile-content { flex: 1; width: 100%; padding-top: calc(5.5rem + var(--safe-area-pt)); padding-bottom: calc(8rem + var(--safe-area-pb)); }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: 5rem;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6); 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; z-index: 50; padding-top: var(--safe-area-pt);
        }

        .floating-nav {
            position: fixed; bottom: calc(1.5rem + var(--safe-area-pb)); left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            border-radius: 3rem; padding: 0.75rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3); z-index: 50;
        }

        .fab-center {
            background: linear-gradient(135deg, #10b981, #059669);
            transform: translateY(-40%); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            border: 4px solid #f8fafc;
        }

        @media (min-width: 1024px) {
            .app-layout { flex-direction: row; }
            .desktop-sidebar { display: flex; flex-direction: column; width: 320px; position: fixed; top: 0; bottom: 0; left: 0; background: #ffffff; border-right: 1px solid #f1f5f9; z-index: 40; }
            .mobile-content { margin-left: 320px; padding-top: 3rem; padding-bottom: 3rem; }
            .mobile-only { display: none !important; }
        }

        .toast-enter { animation: toastEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(-20px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, LineChart, Line } = window.Recharts;

        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px; stroke-width:${strokeWidth}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, size, className, strokeWidth]);
            return <span ref={spanRef} className="inline-flex items-center justify-center" style={{ width: size, height: size }}></span>;
        };

        // --- COMPONENTES SMART CLINICAL TOOLS (Blindados contra loops) --- //
        
        const SmartTUGTimer = ({ value, onChange }) => {
            const [time, setTime] = useState(parseFloat(value) || 0);
            const [isRunning, setIsRunning] = useState(false);

            useEffect(() => {
                let interval;
                if (isRunning) {
                    interval = setInterval(() => setTime(t => t + 0.1), 100);
                }
                return () => clearInterval(interval);
            }, [isRunning]);

            const handleToggle = () => {
                if (isRunning) {
                    setIsRunning(false);
                    onChange(time.toFixed(1)); // Dispara apenas no clique
                } else {
                    setIsRunning(true);
                }
            };

            const handleReset = () => {
                setIsRunning(false);
                setTime(0);
                onChange('');
            };

            const getInterpretation = (sec) => {
                if (!sec || sec <= 0) return null;
                if (sec <= 10) return { l: 'Baixo Risco', c: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
                if (sec <= 20) return { l: 'Risco Moderado', c: 'bg-amber-100 text-amber-700 border-amber-200' };
                return { l: 'Alto Risco (Quedas)', c: 'bg-red-100 text-red-700 border-red-200' };
            };
            
            const interp = getInterpretation(time);

            return (
                <div className="bg-blue-50/50 p-6 rounded-[2rem] border border-blue-100 flex flex-col items-center relative overflow-hidden">
                    <p className="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">TUG Test Integrado</p>
                    <div className="text-5xl font-digital font-black text-blue-600 tracking-tighter mb-2">
                        {time.toFixed(1)}<span className="text-xl text-blue-400">s</span>
                    </div>
                    <div className="h-6 mb-4 flex items-center justify-center">
                        {interp && (
                            <span className={`px-3 py-1 rounded-full border text-[9px] font-black uppercase tracking-widest ${interp.c}`}>
                                {interp.l}
                            </span>
                        )}
                    </div>
                    <div className="flex gap-3 w-full relative z-10">
                        <button type="button" onClick={handleToggle} className={`flex-1 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-md active:scale-95 ${isRunning ? 'bg-red-500 text-white shadow-red-500/30' : 'bg-blue-600 text-white shadow-blue-600/30'}`}>
                            {isRunning ? 'PARAR' : 'INICIAR'}
                        </button>
                        <button type="button" onClick={handleReset} className="px-5 bg-white border border-blue-200 text-blue-500 rounded-2xl active:scale-95">
                            <Icon name="rotate-ccw" size={20} />
                        </button>
                    </div>
                </div>
            );
        };

        const SmartSTSCounter = ({ value, onChange }) => {
            const [reps, setReps] = useState(parseInt(value) || 0);
            const [timeLeft, setTimeLeft] = useState(30);
            const [isRunning, setIsRunning] = useState(false);

            useEffect(() => {
                let interval;
                if (isRunning && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0 && isRunning) {
                    setIsRunning(false);
                }
                return () => clearInterval(interval);
            }, [isRunning, timeLeft]);

            const updateReps = (delta) => {
                const newVal = Math.max(0, reps + delta);
                setReps(newVal);
                onChange(newVal); // Atualiza form seguro
            };

            const getInterpretation = (r) => {
                if (r === 0 && timeLeft === 30) return null;
                if (r < 8) return { l: 'Força Reduzida', c: 'bg-red-100 text-red-700 border-red-200' };
                if (r <= 11) return { l: 'Abaixo da Média', c: 'bg-amber-100 text-amber-700 border-amber-200' };
                return { l: 'Força Adequada', c: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
            };
            const interp = getInterpretation(reps);

            return (
                <div className="bg-emerald-50/50 p-6 rounded-[2rem] border border-emerald-100 flex flex-col items-center">
                    <div className="flex justify-between w-full items-center mb-2">
                        <p className="text-[10px] font-black text-emerald-600 uppercase tracking-widest">STS (Senta/Levanta)</p>
                        <div className={`px-3 py-1 rounded-full font-digital font-black text-sm flex items-center gap-1.5 ${isRunning ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-emerald-100 text-emerald-700'}`}>
                            <Icon name="timer" size={12}/> {timeLeft}s
                        </div>
                    </div>
                    <div className="h-6 mb-3 w-full flex items-center justify-start">
                        {interp && (
                            <span className={`px-3 py-1 rounded-full border text-[9px] font-black uppercase tracking-widest ${interp.c}`}>
                                {interp.l}
                            </span>
                        )}
                    </div>
                    <div className="flex items-center justify-between w-full mb-4">
                        <button type="button" onClick={() => updateReps(-1)} className="w-14 h-14 bg-white border border-emerald-200 text-emerald-600 rounded-2xl flex items-center justify-center shadow-sm active:scale-90"><Icon name="minus" size={24}/></button>
                        <div className="text-5xl font-digital font-black text-emerald-600 tracking-tighter">
                            {reps}<span className="text-xl text-emerald-400">x</span>
                        </div>
                        <button type="button" onClick={() => updateReps(1)} className="w-14 h-14 bg-emerald-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/30 active:scale-90"><Icon name="plus" size={24}/></button>
                    </div>
                    {!isRunning && timeLeft === 30 ? (
                        <button type="button" onClick={() => { setIsRunning(true); setReps(0); }} className="w-full py-3.5 bg-emerald-100 text-emerald-700 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 border border-emerald-200">Iniciar Relógio (30s)</button>
                    ) : (
                        <button type="button" onClick={() => { setIsRunning(false); setTimeLeft(30); }} className="w-full py-3.5 bg-white border border-slate-200 text-slate-500 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95">Resetar Teste</button>
                    )}
                </div>
            );
        };

        const App = () => {
            const GOOGLE_SCRIPT_URL = ""; 

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authView, setAuthView] = useState('login'); 
            const [credentials, setCredentials] = useState({ user: 'wagner', pass: '123456', displayName: 'Dr. Wagner Naue' });
            const [loginInput, setLoginInput] = useState({ user: '', pass: '' });
            const [passInput, setPassInput] = useState({ old: '', new: '', confirm: '' });
            
            const [activeView, setActiveView] = useState('management'); 
            const [patientFilter, setPatientFilter] = useState('active'); 
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const initialEvalState = {
                sys: '', dia: '', weight: '', echo: '', tug: '', sts: '',
                barthel: { alimentacao: 0, banho: 0, higiene: 0, vestir: 0, intestino: 0, bexiga: 0, banheiro: 0, transferencia: 0, mobilidade: 0, escadas: 0 },
                functionalChecks: [], notes: ''
            };

            const [evalForm, setEvalForm] = useState(initialEvalState);
            const [newPatientForm, setNewPatientForm] = useState({ name: '', age: '', clinicalDiagnosis: '', lgpdConsent: false });

            const [patients, setPatients] = useState([
                { 
                    id: 1, name: 'Wilson Ferreira', age: 78, clinicalDiagnosis: 'Pós-AVC Isquêmico', status: 'active', lgpdConsent: true,
                    evaluations: [
                        { date: '01/03', barthel: 45, sts: '8', tug: '18.5', sys: '140', dia: '90', weight: '75', echo: '1.2', functionalChecks: ['Redução de Força', 'Marcha Alterada'], notes: 'Início do tratamento domiciliar.' },
                        { date: '01/04', barthel: 65, sts: '12', tug: '14.2', sys: '135', dia: '85', weight: '74', echo: '1.4', functionalChecks: ['Redução de Força'], notes: 'Evolução favorável nas transferências.' }
                    ]
                },
                { 
                    id: 2, name: 'Maria de Lurdes', age: 82, clinicalDiagnosis: 'Alzheimer / Fratura Fêmur', status: 'active', lgpdConsent: true,
                    evaluations: [{ date: '15/02', barthel: 20, sts: '2', tug: '35.0', sys: '120', dia: '80', weight: '60', echo: '0.9', functionalChecks: ['Incapacidade de Transferência'], notes: 'Paciente restrita ao leito.' }]
                }
            ]);

            const barthelItems = [
                {id:'alimentacao', l:'Alimentação', o:[{v:0, t:'Dep.'}, {v:5, t:'Ajuda'}, {v:10, t:'Indep.'}]},
                {id:'banho', l:'Banho', o:[{v:0, t:'Dep.'}, {v:5, t:'Indep.'}]},
                {id:'higiene', l:'Higiene Pessoal', o:[{v:0, t:'Dep.'}, {v:5, t:'Indep.'}]},
                {id:'vestir', l:'Vestir-se', o:[{v:0, t:'Dep.'}, {v:5, t:'Ajuda'}, {v:10, t:'Indep.'}]},
                {id:'intestino', l:'Intestino', o:[{v:0, t:'Incont.'}, {v:5, t:'Acidente'}, {v:10, t:'Cont.'}]},
                {id:'bexiga', l:'Bexiga', o:[{v:0, t:'Incont.'}, {v:5, t:'Acidente'}, {v:10, t:'Cont.'}]},
                {id:'banheiro', l:'Uso Banheiro', o:[{v:0, t:'Dep.'}, {v:5, t:'Ajuda'}, {v:10, t:'Indep.'}]},
                {id:'transferencia', l:'Transferência (Cama-Cad)', o:[{v:0, t:'Dep.'}, {v:5, t:'Muita Aj.'}, {v:10, t:'Pouca Aj.'}, {v:15, t:'Indep.'}]},
                {id:'mobilidade', l:'Mobilidade', o:[{v:0, t:'Imóvel'}, {v:5, t:'Cadeira'}, {v:10, t:'Acompanhado'}, {v:15, t:'Indep.'}]},
                {id:'escadas', l:'Escadas', o:[{v:0, t:'Dep.'}, {v:5, t:'Ajuda'}, {v:10, t:'Indep.'}]}
            ];

            const checklistOptions = ["Redução de Força Muscular", "Redução de ADM", "Déficit de Equilíbrio", "Alteração de Sensibilidade", "Marcha Alterada", "Incapacidade de Transferência", "Dor ao Movimento", "Espasticidade", "Encurtamento Muscular"];

            const showToastMessage = (message, type = 'success') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); };
            const selectedPatient = useMemo(() => patients.find(p => p.id === selectedPatientId), [patients, selectedPatientId]);
            const calcBarthel = (b) => Object.values(b).reduce((acc, curr) => acc + parseInt(curr || 0), 0);

            const getBarthelClass = (score) => {
                if (score === 100) return { l: 'Independente', c: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
                if (score >= 91) return { l: 'Dep. Leve', c: 'bg-green-100 text-green-700 border-green-200' };
                if (score >= 61) return { l: 'Dep. Moderada', c: 'bg-amber-100 text-amber-700 border-amber-200' };
                if (score >= 21) return { l: 'Dep. Severa', c: 'bg-orange-100 text-orange-700 border-orange-200' };
                return { l: 'Dep. Total', c: 'bg-red-100 text-red-700 border-red-200' };
            };

            const stats = useMemo(() => {
                const ativos = patients.filter(p => p.status === 'active').length;
                const arquivo = patients.filter(p => p.status === 'archived').length;
                const avaliacoes = patients.reduce((acc, p) => acc + p.evaluations.length, 0);
                const pacsComEvolucao = patients.filter(p => p.status === 'active' && p.evaluations.length > 0);
                const mediaBarthel = pacsComEvolucao.length > 0 ? (pacsComEvolucao.reduce((acc, p) => acc + p.evaluations.at(-1).barthel, 0) / pacsComEvolucao.length).toFixed(0) : 0;
                const grafico = [{ mes: 'Jan', val: 3 }, { mes: 'Fev', val: 5 }, { mes: 'Mar', val: ativos }];
                return { ativos, arquivo, avaliacoes, mediaBarthel, grafico };
            }, [patients]);

            const handleAuth = (e) => {
                e.preventDefault();
                const userMatch = loginInput.user.toLowerCase().includes('wagner') || loginInput.user.toLowerCase() === 'admin';
                if (userMatch && loginInput.pass === credentials.pass) {
                    setIsAuthenticated(true); setLoginInput({ user: '', pass: '' });
                } else { showToastMessage('Credenciais inválidas.', 'error'); }
            };

            const handleSaveEvaluation = async (e) => {
                e.preventDefault();
                if (!selectedPatient) return;
                setIsLoading(true);
                
                const score = calcBarthel(evalForm.barthel);
                const evaluationData = { date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}), ...evalForm, barthel: score };
                const updatedPatients = patients.map(p => p.id === selectedPatientId ? { ...p, evaluations: [...p.evaluations, evaluationData] } : p);
                
                try {
                    if (GOOGLE_SCRIPT_URL) {
                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...evaluationData, patientName: selectedPatient.name, clinicalDiagnosis: selectedPatient.clinicalDiagnosis }) });
                    }
                    setTimeout(() => {
                        setPatients(updatedPatients); setActiveView('profile'); setEvalForm(initialEvalState); setIsLoading(false);
                        showToastMessage('Avaliação clínica salva.', 'success');
                    }, 800);
                } catch (error) {
                    setPatients(updatedPatients); setActiveView('profile'); setIsLoading(false);
                    showToastMessage('Salvo offline. Erro de nuvem.', 'error');
                }
            };

            const handleCreatePatient = (e) => {
                e.preventDefault();
                if(!newPatientForm.name) return;
                const newId = Date.now();
                setPatients([...patients, { ...newPatientForm, id: newId, status: 'active', evaluations: [], createdAt: new Date().toISOString().split('T')[0] }]);
                setNewPatientForm({ name: '', age: '', clinicalDiagnosis: '', lgpdConsent: false });
                setSelectedPatientId(newId); setActiveView('profile'); showToastMessage('Prontuário criado e auditado.', 'success');
            };

            const toggleArchivePatient = (id) => {
                const pat = patients.find(p => p.id === id);
                setPatients(patients.map(p => p.id === id ? { ...p, status: p.status === 'active' ? 'archived' : 'active' } : p));
                setActiveView('patients');
                showToastMessage(pat.status === 'active' ? 'Prontuário arquivado.' : 'Atendimento reativado.', 'success');
            };

            const handleBarthelClick = (key, val) => {
                setEvalForm(prev => ({ ...prev, barthel: { ...prev.barthel, [key]: val } }));
            };

            const handleFunctionalToggle = (opt) => {
                setEvalForm(prev => {
                    const exists = prev.functionalChecks.includes(opt);
                    return { ...prev, functionalChecks: exists ? prev.functionalChecks.filter(i => i !== opt) : [...prev.functionalChecks, opt] };
                });
            };

            const fillBarthelMax = () => {
                const maxBarthel = {};
                barthelItems.forEach(item => { maxBarthel[item.id] = item.o[item.o.length - 1].v; });
                setEvalForm(prev => ({...prev, barthel: maxBarthel}));
            };

            // --- RENDERIZADORES BLINDADOS (FUNÇÕES) ---
            const renderDashboard = () => (
                <div className="animate-fade-in space-y-6 lg:space-y-8">
                    <header className="mb-6 lg:mb-10">
                        <h2 className="text-3xl lg:text-4xl font-black text-slate-900 tracking-tight">Gestão Clínica</h2>
                        <p className="text-sm font-medium text-slate-500 mt-1">Bem-vindo(a), {credentials.displayName}.</p>
                    </header>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6">
                        <div className="card-premium p-6 flex flex-col justify-between h-40"><div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><Icon name="users" /></div><div className="mt-4"><p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.15em] mb-1">Em Atendimento</p><p className="text-3xl font-black text-slate-800">{stats.ativos}</p></div></div>
                        <div className="card-premium p-6 flex flex-col justify-between h-40 bg-emerald-600 text-white border-none shadow-[0_10px_30px_rgba(16,185,129,0.3)]"><div className="w-10 h-10 bg-white/20 text-white rounded-2xl flex items-center justify-center"><Icon name="trending-up" /></div><div className="mt-4"><p className="text-[10px] font-black text-emerald-100 uppercase tracking-[0.15em] mb-1">Média Barthel</p><p className="text-4xl font-black">{stats.mediaBarthel}</p></div></div>
                        <div className="card-premium p-6 flex flex-col justify-between h-40"><div className="w-10 h-10 bg-slate-100 text-slate-500 rounded-2xl flex items-center justify-center"><Icon name="archive" /></div><div className="mt-4"><p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.15em] mb-1">Arquivados</p><p className="text-3xl font-black text-slate-800">{stats.arquivo}</p></div></div>
                        <div className="card-premium p-6 flex flex-col justify-between h-40"><div className="w-10 h-10 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center"><Icon name="clipboard-check" /></div><div className="mt-4"><p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.15em] mb-1">Avaliações Feitas</p><p className="text-3xl font-black text-slate-800">{stats.avaliacoes}</p></div></div>
                    </div>
                    <div className="card-premium p-6 lg:p-8">
                        <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-2"><Icon name="bar-chart-2" size={16} className="text-emerald-500"/> Fluxo de Pacientes</h3>

                                <form onSubmit={handleChangePassword} className="bg-white rounded-[2.5rem] p-8 premium-shadow space-y-4 animate-fade-in">
                                    <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4"><button type="button" onClick={() => setAuthView('login')} className="p-2 bg-slate-50 rounded-xl text-slate-500 hover:text-slate-800 transition-colors"><Icon name="arrow-left" size={18}/></button><h3 className="font-black text-slate-800 text-lg">Atualizar Senha</h3></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Senha Atual</label><input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest" value={passInput.old} onChange={e => setPassInput({...passInput, old: e.target.value})} /></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nova Senha</label><input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.new} onChange={e => setPassInput({...passInput, new: e.target.value})} /></div>
                                    <div className="space-y-1.5"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirmar Senha</label><input type="password" required className="w-full input-soft rounded-2xl px-5 py-3 font-black tracking-widest text-emerald-600" value={passInput.confirm} onChange={e => setPassInput({...passInput, confirm: e.target.value})} /></div>
                                    <button type="submit" className="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black shadow-xl hover:bg-emerald-700 transition-all active:scale-[0.98] mt-4">SALVAR E VOLTAR</button>
                                </form>
                            )}
                            <div className="mt-8 flex justify-center opacity-50"><span className="text-[9px] font-black text-white uppercase tracking-[0.2em] flex items-center gap-1"><Icon name="shield-check" size={12}/> Auditoria LGPD Compliant</span></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-layout">
                    {toast && (<div className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] toast-enter w-[90%] max-w-sm"><div className={`px-5 py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.2)] flex items-center gap-3 font-bold text-xs uppercase tracking-wider ${toast.type === 'success' ? 'bg-slate-900 text-white' : 'bg-red-500 text-white'}`}><Icon name={toast.type === 'success' ? 'check-circle-2' : 'alert-circle'} size={18} />{toast.message}</div></div>)}
                    <header className="mobile-header mobile-only"><div className="flex items-center gap-3"><div className="bg-slate-900 p-2.5 rounded-xl text-white shadow-md"><Icon name="activity" size={18} /></div><h1 className="text-xl font-black tracking-tight text-slate-900">Fisio<span className="text-emerald-500">Home</span></h1></div><div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-[10px] font-black text-slate-600 premium-shadow">{credentials.displayName.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase()}</div></header>
                    
                    <aside className="desktop-sidebar">
                        <div className="p-8 pb-4"><div className="flex items-center gap-3 mb-12"><div className="bg-slate-900 p-3 rounded-[1.2rem] text-white shadow-lg"><Icon name="activity" size={24} /></div><div><h1 className="text-2xl font-black text-slate-900 tracking-tighter leading-none">Fisio<span className="text-emerald-500">Home</span></h1><p className="text-[9px] font-black uppercase tracking-[0.3em] text-slate-400 mt-1">HealthTech Pro</p></div></div><nav className="space-y-2"><button onClick={() => setActiveView('management')} className={`w-full flex items-center gap-4 px-5 py-4 rounded-[1.2rem] font-black text-xs uppercase tracking-widest transition-colors ${activeView === 'management' ? 'bg-slate-100 text-slate-900' : 'text-slate-400 hover:bg-slate-50'}`}><Icon name="layout-dashboard" size={18} /> Dashboard</button><button onClick={() => { setActiveView('patients'); setSelectedPatientId(null); }} className={`w-full flex items-center gap-4 px-5 py-4 rounded-[1.2rem] font-black text-xs uppercase tracking-widest transition-colors ${['patients','profile','eval','new_patient'].includes(activeView) ? 'bg-slate-100 text-slate-900' : 'text-slate-400 hover:bg-slate-50'}`}><Icon name="users" size={18} /> Prontuários</button></nav></div>
                        <div className="mt-auto p-8 border-t border-slate-100 bg-slate-50/50"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 font-black premium-shadow">{credentials.displayName.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase()}</div><div><p className="text-xs font-black text-slate-800">{credentials.displayName}</p><p className="text-[9px] text-emerald-600 uppercase font-black tracking-widest mt-0.5">Gestor de Auditoria</p></div></div></div>
                    </aside>

                    <main className="mobile-content px-4 lg:px-12">
                        <div className="max-w-5xl mx-auto">
                            {activeView === 'management' && renderDashboard()}
                            {activeView === 'patients' && renderPatients()}
                            {activeView === 'profile' && renderProfile()}
                            {activeView === 'eval' && renderEvalForm()}
                            {activeView === 'new_patient' && renderNewPatient()}
                        </div>
                    </main>

                    {['management', 'patients'].includes(activeView) && (
                        <nav className="floating-nav mobile-only">
                            <button onClick={() => setActiveView('management')} className={`p-3 rounded-full transition-colors ${activeView === 'management' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}><Icon name="layout-dashboard" size={24} /></button>
                            <button onClick={() => setActiveView('new_patient')} className="w-14 h-14 rounded-full fab-center text-white flex items-center justify-center"><Icon name="plus" size={28}/></button>
                            <button onClick={() => setActiveView('patients')} className={`p-3 rounded-full transition-colors ${activeView === 'patients' ? 'text-emerald-400 bg-white/10' : 'text-slate-400 hover:text-white'}`}><Icon name="users" size={24} /></button>
                        </nav>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
